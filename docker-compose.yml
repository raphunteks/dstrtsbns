# VPS: aplikasi + Caddy (HTTPS otomatis). Database, Storage, Auth, dan cron tetap di Supabase.
# Pemakaian: isi .env (lihat .env.example), set DOMAIN, lalu `docker compose up -d --build`.

services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}
    env_file: .env
    environment:
      DEPLOY_TARGET: vps
    restart: unless-stopped
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:?isi DOMAIN di .env, mis. dastertasbon.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/vps/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
