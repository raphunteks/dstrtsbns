name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Nilai dummy: CI tidak menyentuh database atau layanan nyata.
      POSTGRES_PRISMA_URL: postgresql://ci:ci@localhost:5432/ci?schema=app
      POSTGRES_URL_NON_POOLING: postgresql://ci:ci@localhost:5432/ci?schema=app
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            echo "::warning::pnpm-lock.yaml belum ada — install tanpa lockfile"
            pnpm install --no-frozen-lockfile
          fi

      - name: Upload lockfile (bila baru dibuat)
        if: hashFiles('pnpm-lock.yaml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-lock
          path: pnpm-lock.yaml
          retention-days: 7

      - name: Prisma validate
        run: pnpm db:validate

      - name: Unit test
        run: pnpm test

      - name: Build (termasuk typecheck & lint Next.js)
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        # Belum memblokir: file awal ditulis tanpa prettier lokal. Jadikan wajib setelah `pnpm format` pertama.
        continue-on-error: true
        run: pnpm format:check
